name: CI

on:
  pull_request:
  push:
    branches: [development]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buzz_board_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buzz_board_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      # Test-only services above; no secrets or provider credentials are used.
      DATABASE_URL: postgresql://postgres:postgres@localhost:55432/buzz_board_test
      KV_URL: redis://localhost:56379/0
      NEXT_PUBLIC_QRCODE_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run check
      - name: Unit and component tests
        run: bun run test
      - name: Integration tests (PostgreSQL + Redis)
        run: bun run test:integration
      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
